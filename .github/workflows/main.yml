name: build, test and release sqlite-multiwriter
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A new push to a branch replaces the run that is still going on for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[auto-update]') }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container && matrix.container || '' }}
    name: ${{ matrix.name }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }} build${{ matrix.test && ' + test' || '' }}
    timeout-minutes: 45
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (glibc and musl), x86_64 and ARM. test: full = the whole suite (the stress tests too), ci = the suite without the long stress tests
          - os: ubuntu-22.04
            arch: x86_64
            name: linux
            test: full
          - os: ubuntu-22.04-arm
            arch: arm64
            name: linux
            test: ci
          - os: ubuntu-22.04
            arch: x86_64
            name: linux-musl
            container: alpine:latest
            test: ci
          - os: ubuntu-22.04-arm
            arch: arm64
            name: linux-musl
            test: ci
          # macOS: one universal binary (x86_64 + arm64), and each architecture alone
          - os: macos-15
            name: macos
            test: full
          - os: macos-15
            arch: x86_64
            name: macos
            make: extension ARCH=x86_64
          - os: macos-15
            arch: arm64
            name: macos
            make: extension ARCH=arm64
          # Windows
          - os: windows-2022
            arch: x86_64
            name: windows
            test: windows
          # Android: the four ABIs; the x86_64 one is also run in an emulator
          - os: ubuntu-22.04
            arch: arm64-v8a
            name: android
            make: extension PLATFORM=android ARCH=arm64-v8a
          - os: ubuntu-22.04
            arch: armeabi-v7a
            name: android
            make: extension PLATFORM=android ARCH=armeabi-v7a
          - os: ubuntu-22.04
            arch: x86_64
            name: android
            make: extension PLATFORM=android ARCH=x86_64
            test: emulator
          - os: ubuntu-22.04
            arch: x86
            name: android
            make: extension PLATFORM=android ARCH=x86
          # Apple: iOS, the iOS simulator, Mac Catalyst, and the XCFramework with all of them
          - os: macos-15
            name: ios
            make: extension PLATFORM=ios
          - os: macos-15
            name: ios-sim
            make: extension PLATFORM=ios-sim
          - os: macos-15
            name: mac-catalyst
            make: extension PLATFORM=mac-catalyst
          - os: macos-15
            name: apple-xcframework
            make: xcframework
          # the Android library (AAR) with the four ABIs
          - os: ubuntu-22.04
            name: android-aar
            make: aar

    defaults:
      run:
        shell: ${{ matrix.container && 'sh' || (matrix.name == 'windows' && 'msys2 {0}' || 'bash') }}

    steps:
      - name: where the tests make their databases (a native Windows program has no /tmp)
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: alpine - install the tools
        if: matrix.container
        run: apk add --no-cache git gcc make musl-dev linux-headers

      - uses: actions/checkout@v4.2.2

      - name: linux-musl arm64 - start an alpine container
        if: matrix.name == 'linux-musl' && matrix.arch == 'arm64'
        run: |
          docker run -d --name alpine --platform linux/arm64 -v ${{ github.workspace }}:/workspace -w /workspace alpine:latest tail -f /dev/null
          docker exec alpine apk add --no-cache gcc make musl-dev linux-headers

      - uses: msys2/setup-msys2@v2.27.0
        if: matrix.name == 'windows'
        with:
          msystem: mingw64
          install: mingw-w64-x86_64-gcc make

      - name: android-aar - java for gradle
        if: matrix.name == 'android-aar'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: android-aar - gradle
        if: matrix.name == 'android-aar'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: android - the NDK of the runner
        if: startsWith(matrix.name, 'android')
        run: echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: the version
        run: echo "MW_VERSION=$(make version)" >> $GITHUB_ENV

      - name: build the extension
        run: ${{ matrix.name == 'linux-musl' && matrix.arch == 'arm64' && 'docker exec alpine' || '' }} make ${{ matrix.make && matrix.make || (matrix.name == 'windows' && 'extension PLATFORM=windows' || (matrix.name == 'linux-musl' && 'extension PLATFORM=linux-musl' || 'extension')) }}

      - name: sign and notarize the dylib
        if: startsWith(matrix.os, 'macos') && matrix.name != 'apple-xcframework' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          codesign --sign "$APPLE_TEAM_ID" --timestamp --options runtime dist/multiwriter.dylib
          ditto -c -k dist/multiwriter.dylib dist/multiwriter.zip
          xcrun notarytool submit dist/multiwriter.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          rm dist/multiwriter.zip certificate.p12
          security delete-keychain build.keychain

      - name: sign and notarize the xcframework
        if: matrix.name == 'apple-xcframework' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          find dist/MultiWriter.xcframework -name "*.framework" -exec codesign --sign "$APPLE_TEAM_ID" --timestamp --options runtime {} \;
          codesign --sign "$APPLE_TEAM_ID" --timestamp --options runtime dist/MultiWriter.xcframework
          ditto -c -k --keepParent dist/MultiWriter.xcframework dist/MultiWriter.xcframework.zip
          xcrun notarytool submit dist/MultiWriter.xcframework.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          rm -rf dist/MultiWriter.xcframework certificate.p12
          security delete-keychain build.keychain

      - name: the xcframework as a zip (ditto keeps the symbolic links of the macOS framework)
        if: matrix.name == 'apple-xcframework' && env.APPLE_CERTIFICATE == ''
        run: ditto -c -k --keepParent dist/MultiWriter.xcframework dist/MultiWriter.xcframework.zip && rm -rf dist/MultiWriter.xcframework

      # ---- tests: the suite of the engine (it links the SQLite of third_party/sqlite) and the extension loaded into a stock SQLite ----
      - name: test the extension loaded into SQLite
        if: matrix.test == 'full' || matrix.test == 'ci' || matrix.test == 'windows'
        run: ${{ matrix.name == 'linux-musl' && matrix.arch == 'arm64' && 'docker exec alpine' || '' }} make test-loadable ${{ matrix.name == 'windows' && 'PLATFORM=windows' || (matrix.name == 'linux-musl' && 'PLATFORM=linux-musl' || '') }}

      - name: test the engine (the whole suite)
        if: matrix.test == 'full'
        run: make test && make test-mp

      - name: test the engine on Windows (the suite, then the processes mode)
        if: matrix.test == 'windows'
        run: make test-ci PLATFORM=windows && make test-mp PLATFORM=windows

      - name: test the engine (without the long stress tests)
        if: matrix.test == 'ci'
        run: ${{ matrix.name == 'linux-musl' && matrix.arch == 'arm64' && 'docker exec alpine' || '' }} make test-ci

      - name: android emulator - build the test and the script
        if: matrix.test == 'emulator'
        run: |
          make ${{ matrix.make }} dist/loadable
          echo 'set -e; cd /data/local/tmp; export TMPDIR=/data/local/tmp; ./loadable ./multiwriter.so; echo EXIT_CODE=0' > dist/commands.sh

      - name: android emulator - run
        if: matrix.test == 'emulator'
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 26
          arch: ${{ matrix.arch }}
          script: |
            adb push dist/loadable dist/multiwriter.so dist/commands.sh /data/local/tmp/
            adb shell "chmod +x /data/local/tmp/loadable; sh /data/local/tmp/commands.sh; echo EXIT_CODE=\$?" | tee /tmp/adb_output.log
            grep -q "EXIT_CODE=0" /tmp/adb_output.log

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: multiwriter-${{ matrix.name }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: dist/${{ matrix.name == 'apple-xcframework' && 'MultiWriter.*' || 'multiwriter.*' }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-22.04
    name: release
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    outputs:
      version: ${{ steps.tag.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4.2.1
        with:
          path: artifacts

      - name: the version (MW_VERSION in src/multiwriter.h), and is it released already
        id: tag
        run: |
          VERSION=$(make version)
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::warning file=src/multiwriter.h::$VERSION is released already: to release again, change MW_VERSION in src/multiwriter.h"
            echo "version=" >> $GITHUB_OUTPUT
          else
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: pack the artifacts
        if: steps.tag.outputs.version != ''
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          for folder in artifacts/*; do
            [ -d "$folder" ] || continue
            name=$(basename "$folder")
            if [ "$name" = "multiwriter-apple-xcframework" ]; then
              cp "$folder/MultiWriter.xcframework.zip" "${name}-${VERSION}.zip"
            elif [ "$name" = "multiwriter-android-aar" ]; then
              cp "$folder"/*.aar "${name}-${VERSION}.aar"
            else
              tar -czf "${name}-${VERSION}.tar.gz" -C "$folder" .
              (cd "$folder" && zip -rq "../../${name}-${VERSION}.zip" .)
            fi
          done
          ls -la *-${VERSION}.*

      - name: Package.swift - the url and the checksum of the XCFramework of this release
        if: steps.tag.outputs.version != ''
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          ZIP="multiwriter-apple-xcframework-${VERSION}.zip"
          URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ZIP}"
          CHECKSUM=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          sed -i "s|url: \".*\"|url: \"${URL}\"|; s|checksum: \".*\"|checksum: \"${CHECKSUM}\"|" Package.swift
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add Package.swift
          git commit -m "Package.swift: the XCFramework of ${VERSION} [auto-update]" || true
          git push origin HEAD || true

      - uses: softprops/action-gh-release@v2.2.1
        if: steps.tag.outputs.version != ''
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          make_latest: true
          body: |
            # sqlite-multiwriter ${{ steps.tag.outputs.version }}

            SQLite with more writers: many threads and processes write one database at the same time. A loadable extension: `SELECT load_extension('multiwriter')`, then open the database with `vfs=multiwriter`.

            | Platform | File |
            |---|---|
            | Linux (glibc), x86_64 and arm64 | `multiwriter-linux-<arch>-<version>.tar.gz` |
            | Linux (musl, Alpine), x86_64 and arm64 | `multiwriter-linux-musl-<arch>-<version>.tar.gz` |
            | macOS, universal / x86_64 / arm64 | `multiwriter-macos-<arch>-<version>.tar.gz` |
            | Windows x86_64 | `multiwriter-windows-x86_64-<version>.zip` |
            | Android arm64-v8a, armeabi-v7a, x86_64, x86 | `multiwriter-android-<abi>-<version>.tar.gz`, and `multiwriter-android-aar-<version>.aar` |
            | iOS, iOS simulator, Mac Catalyst | `multiwriter-ios-<version>.tar.gz`, `multiwriter-ios-sim-<version>.tar.gz`, `multiwriter-mac-catalyst-<version>.tar.gz` |
            | Apple XCFramework (Swift Package) | `multiwriter-apple-xcframework-<version>.zip` |
          files: |
            multiwriter-*-${{ steps.tag.outputs.version }}.*
